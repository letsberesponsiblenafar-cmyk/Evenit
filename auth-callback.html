<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#54259a">
  <title>Verify your email · evenit</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f5;--surface:#fff;--ink:#25232a;--muted:#68656f;--line:#e2e1e6;--primary:#54259a;--soft:#eee8f7;--teal:#087f77;--teal-soft:#e3f3f0;--coral:#c74f3e;--coral-soft:#fff0eb;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{display:grid;place-items:center;min-height:100dvh;margin:0;padding:24px;background:radial-gradient(circle at 50% 0,#eee8f7 0,transparent 38%),var(--bg);color:var(--ink)}
    main{width:min(480px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 18px 56px rgba(31,24,43,.1);text-align:center}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 22px;border-radius:19px;background:var(--soft);color:var(--primary);font-size:30px;font-weight:800}
    .mark.success{background:var(--teal-soft);color:var(--teal)}.mark.error{background:var(--coral-soft);color:var(--coral)}
    .eyebrow{margin:0 0 8px;color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1.08;letter-spacing:-.045em}p{margin:14px auto 0;max-width:38ch;color:var(--muted);font-size:14px;line-height:1.6}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:25px;padding:0 22px;border-radius:13px;background:var(--primary);color:#fff;font-size:14px;font-weight:750;text-decoration:none}small{display:block;margin-top:16px;color:var(--muted);font-size:11px;line-height:1.5}
    @media(prefers-color-scheme:dark){:root{--bg:#100e14;--surface:#19161f;--ink:#f6f2fa;--muted:#b3aabd;--line:#393241;--primary:#b985f2;--soft:#302241;--teal:#65d7ca;--teal-soft:#173936;--coral:#ff9d8d;--coral-soft:#432721}body{background:radial-gradient(circle at 50% 0,#302241 0,transparent 40%),var(--bg)}main{box-shadow:0 18px 56px rgba(0,0,0,.4)}a{color:#1b1125}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" id="status-mark">…</div>
    <p class="eyebrow">evenit account</p>
    <h1 id="status-title">Verifying your email</h1>
    <p id="status-copy">Please keep this page open for a moment while we confirm your account.</p>
    <a id="continue-link" href="./#profile" hidden>Continue to evenit</a>
    <small id="status-help">This normally takes only a few seconds.</small>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=auth-callback-v1"></script>
  <script>
    (async function(){
      const mark=document.querySelector('#status-mark');
      const title=document.querySelector('#status-title');
      const copy=document.querySelector('#status-copy');
      const link=document.querySelector('#continue-link');
      const help=document.querySelector('#status-help');
      const show=(ok,message)=>{
        mark.className='mark '+(ok?'success':'error');mark.textContent=ok?'✓':'!';
        title.textContent=ok?'Email verified':'Verification unsuccessful';
        copy.textContent=message;
        link.hidden=false;
        link.textContent=ok?'Continue to evenit':'Return to evenit';
        help.textContent=ok?'Your profile is ready. You can now log in on the website or app.':'The link may have expired or already been used. Return to evenit and request a new email if needed.';
      };
      try{
        if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase)throw new Error('Account verification is temporarily unavailable.');
        const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:true,persistSession:true}});
        const url=new URL(window.location.href);
        const authError=url.searchParams.get('error_description')||url.searchParams.get('error');
        if(authError)throw new Error(authError.replace(/\+/g,' '));
        const code=url.searchParams.get('code');
        if(code){
          const {error}=await client.auth.exchangeCodeForSession(code);
          if(error)throw error;
        }
        const {data,error}=await client.auth.getSession();
        if(error)throw error;
        if(data?.session?.user){show(true,'Your email has been confirmed successfully.');return;}
        const hash=new URLSearchParams(window.location.hash.replace(/^#/,''));
        if(hash.get('access_token')){
          const {data:sessionData,error:sessionError}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});
          if(sessionError)throw sessionError;
          if(sessionData?.session){show(true,'Your email has been confirmed successfully.');return;}
        }
        throw new Error('We could not confirm this email link.');
      }catch(error){show(false,error?.message||'We could not confirm this email link.');}
    })();
  </script>
</body>
</html>
