name: Build Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the app tooling
        run: npm ci
      - name: Sync the mobile app
        run: npm run mobile:sync
      - name: Build a sideloadable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare the download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Evenit.apk
      - name: Publish the APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Evenit.apk --title "Evenit Android ${GITHUB_REF_NAME#android-v}" --generate-notes
