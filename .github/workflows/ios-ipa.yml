name: Build signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Apple distribution method for the installed provisioning profile
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - development
          - app-store-connect

permissions:
  contents: read

jobs:
  signed-ipa:
    name: Build signed Evenit.ipa
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Apple signing configuration
        run: |
          test -n "$IOS_CERTIFICATE_P12_BASE64" || (echo "Missing IOS_CERTIFICATE_P12_BASE64" && exit 1)
          test -n "$IOS_CERTIFICATE_PASSWORD" || (echo "Missing IOS_CERTIFICATE_PASSWORD" && exit 1)
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || (echo "Missing IOS_PROVISIONING_PROFILE_BASE64" && exit 1)
          test -n "$IOS_KEYCHAIN_PASSWORD" || (echo "Missing IOS_KEYCHAIN_PASSWORD" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
      - name: Install dependencies and sync iOS
        run: |
          npm ci
          npm run mobile:sync:ios
      - name: Install certificate and provisioning profile
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/evenit.p12"
          PROFILE_PATH="$RUNNER_TEMP/evenit.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/evenit-signing.keychain-db"
          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          if [ "${{ inputs.export_method }}" = "development" ]; then
            echo "SIGNING_IDENTITY=Apple Development" >> "$GITHUB_ENV"
          else
            echo "SIGNING_IDENTITY=Apple Distribution" >> "$GITHUB_ENV"
          fi
      - name: Archive the iPhone app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/Evenit.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="$SIGNING_IDENTITY"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          archive
      - name: Export Evenit IPA
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string ${{ inputs.export_method }}" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:app.evenit.mobile string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Evenit.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mv "$RUNNER_TEMP/export"/*.ipa Evenit.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Evenit-iOS-IPA
          path: Evenit.ipa
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/evenit-signing.keychain-db" || true
